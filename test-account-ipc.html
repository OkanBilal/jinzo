<!DOCTYPE html>
<html>
<head>
  <title>Test Account IPC</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #005a9e;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 4px;
      overflow: auto;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Account IPC Handler Test</h1>
  
  <div>
    <button onclick="testGetAccount()">Test Get Account</button>
    <button onclick="testUpdateAccount()">Test Update Account</button>
    <button onclick="testValidation()">Test Validation Errors</button>
  </div>
  
  <div id="output"></div>

  <script>
    const output = document.getElementById('output');

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = type;
      div.innerHTML = `<h3>${message}</h3>`;
      output.appendChild(div);
    }

    function logJSON(data) {
      const pre = document.createElement('pre');
      pre.textContent = JSON.stringify(data, null, 2);
      output.appendChild(pre);
    }

    async function testGetAccount() {
      output.innerHTML = '';
      log('Testing Get Account...');
      
      try {
        const result = await window.api.account.get();
        
        if (result.success) {
          log('✅ Get Account Success', 'success');
          logJSON(result.data);
        } else {
          log('❌ Get Account Failed', 'error');
          logJSON(result);
        }
      } catch (error) {
        log('❌ Exception:', 'error');
        logJSON(error.message);
      }
    }

    async function testUpdateAccount() {
      output.innerHTML = '';
      log('Testing Update Account...');
      
      const testData = {
        displayName: 'Test User',
        email: 'test@example.com',
        company: 'Test Company',
        jobTitle: 'Software Engineer',
        timezone: 'America/New_York',
        bio: 'This is a test bio'
      };
      
      log('Sending update with:');
      logJSON(testData);
      
      try {
        const result = await window.api.account.update(testData);
        
        if (result.success) {
          log('✅ Update Account Success', 'success');
          logJSON(result.data);
        } else {
          log('❌ Update Account Failed', 'error');
          logJSON(result);
        }
      } catch (error) {
        log('❌ Exception:', 'error');
        logJSON(error.message);
      }
    }

    async function testValidation() {
      output.innerHTML = '';
      log('Testing Validation Errors...');
      
      const invalidData = {
        email: 'invalid-email',
        displayName: 'x'.repeat(200), // exceeds limit
      };
      
      log('Sending invalid data:');
      logJSON(invalidData);
      
      try {
        const result = await window.api.account.update(invalidData);
        
        if (result.success) {
          log('⚠️ Should have failed validation', 'error');
          logJSON(result.data);
        } else if (result.errors) {
          log('✅ Validation errors caught correctly', 'success');
          logJSON(result.errors);
        } else {
          log('❌ Unexpected result', 'error');
          logJSON(result);
        }
      } catch (error) {
        log('❌ Exception:', 'error');
        logJSON(error.message);
      }
    }

    // Auto-run first test
    window.addEventListener('load', () => {
      setTimeout(testGetAccount, 500);
    });
  </script>
</body>
</html>
