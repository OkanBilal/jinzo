name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish (${{ matrix.arch }})
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure tag is from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "This tag is not on main. Release is blocked."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # npm ci on the arm64 runner only installs the host-arch copilot binary
      # package (@github/copilot-darwin-arm64). The x64 build needs the x64
      # variant, so fetch its tarball and drop it into node_modules directly —
      # `npm install --cpu x64` would re-reify the whole tree against x64 and
      # could swap out build tooling (esbuild etc.) needed on the arm64 host.
      - name: Install x64 Copilot binary package
        if: matrix.arch == 'x64'
        run: |
          # Read the file directly — @github/copilot's "exports" field blocks
          # require('@github/copilot/package.json') as a bare specifier.
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@github/copilot/package.json', 'utf8')).optionalDependencies['@github/copilot-darwin-x64']")
          npm pack "@github/copilot-darwin-x64@$VERSION"
          mkdir -p node_modules/@github/copilot-darwin-x64
          tar -xzf github-copilot-darwin-x64-*.tgz -C node_modules/@github/copilot-darwin-x64 --strip-components=1
          rm github-copilot-darwin-x64-*.tgz

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

      - name: Publish
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional — when unset, osx-sign auto-discovers the imported cert.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-forge publish --platform darwin --arch ${{ matrix.arch }}
