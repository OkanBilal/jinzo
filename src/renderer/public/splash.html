<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jinzo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      background: rgba(4, 4, 4, 0.7);
    }

    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    .app-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }

    .ascii-loader {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      margin-top: 24px;
    }

    .spinner {
      font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 16px;
      color: #4a9bf0;
    }

    .loader-word {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: linear-gradient(90deg, #a09d95 0%, #ffffff 50%, #a09d95 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2s ease-in-out infinite;
    }

    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-color-scheme: light) {
      .splash-container {
        background: rgba(250, 250, 250, 0.7);
      }

      .app-name {
        color: #1a1a1a;
      }

      .loader-word {
        background: linear-gradient(90deg, #666 0%, #1a1a1a 50%, #666 100%);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 2s ease-in-out infinite;
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img class="logo" src="icon.png" alt="Jinzo" />
    <div class="ascii-loader">
      <span class="spinner">⠋</span>
      <span class="loader-word">Brewing...</span>
    </div>
  </div>

  <script>
    const ASCII_FRAMES = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    const LOADER_WORDS = [
      'Brewing', 'Steeping', 'Blooming', 'Infusing', 'Settling',
      'Pouring', 'Warming', 'Stirring', 'Slow-thinking', 'Daydreaming',
      'Wandering', 'Drift-sorting', 'Quieting'
    ];

    const spinner = document.querySelector('.spinner');
    const loaderWord = document.querySelector('.loader-word');
    let frameIndex = 0;

    setInterval(() => {
      frameIndex = (frameIndex + 1) % ASCII_FRAMES.length;
      spinner.textContent = ASCII_FRAMES[frameIndex];
    }, 80);

    setInterval(() => {
      const randomWord = LOADER_WORDS[Math.floor(Math.random() * LOADER_WORDS.length)];
      loaderWord.textContent = randomWord + '...';
    }, 3000);
  </script>
</body>
</html>
